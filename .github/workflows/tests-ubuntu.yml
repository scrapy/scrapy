name: Ubuntu

permissions:
  contents: read

on:
  push:
    branches:
    - master
    - '[0-9]+.[0-9]+'
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{github.workflow}}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event.action != 'closed'
    name: tests (${{ matrix.python-version }}, ${{ matrix.env.TOXENV }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTEST_ADDOPTS: ${{ matrix.coverage && '-n logical' || '-n logical --no-cov' }}
      # Make uv use the interpreter that actions/setup-python installed instead
      # of downloading one of its own.
      UV_PYTHON_PREFERENCE: only-system
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.10"
          env:
            TOXENV: py
        - python-version: "3.11"
          env:
            TOXENV: py
        - python-version: "3.12"
          env:
            TOXENV: py
        - python-version: "3.13"
          env:
            TOXENV: py
        - python-version: "3.14"
          env:
            TOXENV: py
          coverage: true
        - python-version: "3.14"
          env:
            TOXENV: default-reactor
          coverage: true
        - python-version: "3.14"
          env:
            TOXENV: no-reactor
          coverage: true

        # min deps
        - python-version: "3.10.19"
          env:
            TOXENV: min
          coverage: true
        - python-version: "3.10.19"
          env:
            TOXENV: min-default-reactor
          coverage: true
        # pinned due to https://github.com/pypy/pypy/issues/5388
        - python-version: pypy3.11-7.3.20
          env:
            TOXENV: min-pypy3
        - python-version: "3.10.19"
          env:
            TOXENV: min-extra-deps
          coverage: true
        - python-version: "3.10.19"
          env:
            TOXENV: min-botocore
          coverage: true

        - python-version: "3.14"
          env:
            TOXENV: extra-deps
          coverage: true
        - python-version: "3.14"
          env:
            TOXENV: no-reactor-extra-deps
          coverage: true
        # pinned due to https://github.com/pypy/pypy/issues/5388
        - python-version: pypy3.11-7.3.20
          env:
            TOXENV: pypy3-extra-deps
          coverage: true
        - python-version: "3.14"
          env:
            TOXENV: botocore
          coverage: true

        # 3.15 pre-release
        - python-version: "3.15.0-rc.1"
          env:
            TOXENV: py
        - python-version: "3.15.0-rc.1"
          env:
            TOXENV: default-reactor
        - python-version: "3.15.0-rc.1"
          env:
            TOXENV: no-reactor

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system libraries
      if: contains(matrix.python-version, 'pypy') || contains(matrix.env.TOXENV, 'min')
      run: |
        sudo apt-get update
        sudo apt-get install libxml2-dev libxslt-dev

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        cache-dependency-glob: |
          pyproject.toml
          tox.ini

    - name: Install mitmproxy
      env:
        # mitmproxy needs a newer Python than the oldest matrix entries, so let
        # uv download one where no system interpreter is new enough.
        UV_PYTHON_PREFERENCE: system
      # mitmproxy has no PyPy wheels, so run it on CPython regardless of the
      # interpreter under test.
      run: uv tool install --python cpython mitmproxy

    - name: Run tests
      env: ${{ matrix.env }}
      run: uvx --with tox-uv tox

    - name: Upload coverage report
      if: ${{ matrix.coverage }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        report_type: test_results
