name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Upload release to PyPI
    needs:
      - build
      - release-notes
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/Scrapy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-notes:
    name: Build GitHub release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: |
          python -m pip install tox
          tox -e docs
          python extras/github-release-notes.py "$GITHUB_REF_NAME" docs/_build/html/news.md > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  github-release:
    name: Create GitHub release
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The $GITHUB_REF_NAME release already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          fi

  read-the-docs:
    name: Create the new branch and make it the Read the Docs default
    if: endsWith(github.ref_name, '.0')
    needs:
      - publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF_NAME%.0}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" > /dev/null 2>&1; then
            echo "The $branch branch already exists"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA"
          fi
      - env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
        run: |
          branch="${GITHUB_REF_NAME%.0}"
          api=https://app.readthedocs.org/api/v3/projects/scrapy
          rtd() { curl --fail-with-body -sS -H "Authorization: Token $RTD_TOKEN" "$@"; }
          rtd -X POST "$api/sync-versions/"
          for _ in $(seq 30); do
            rtd -o /dev/null "$api/versions/$branch/" 2> /dev/null && break
            sleep 10
          done
          rtd -X PATCH -H "Content-Type: application/json" -d '{"active": true}' "$api/versions/$branch/"
          rtd -X PATCH -H "Content-Type: application/json" -d "{\"default_branch\": \"$branch\"}" "$api/"
          rtd -X POST "$api/versions/latest/builds/"

  upgrade-ci-pins:
    if: endsWith(github.ref_name, '.0')
    needs:
      - publish
    uses: $/.github/workflows/upgrade-ci-pins.yml
    secrets:
      CI_PINS_APP_PRIVATE_KEY: ${{ secrets.CI_PINS_APP_PRIVATE_KEY }}
