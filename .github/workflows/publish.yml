name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Upload release to PyPI
    needs:
      - build
      - release-notes
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/Scrapy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release-notes:
    name: Build GitHub release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: |
          python -m pip install -r docs/requirements.txt
          python -m pip install .
          sphinx-build -b html -q docs docs/_build/html
          python extras/github-release-notes.py "$GITHUB_REF_NAME" docs/_build/html/news.md > release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  github-release:
    name: Create GitHub release
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The $GITHUB_REF_NAME release already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          fi

  read-the-docs:
    name: Make the new branch the Read the Docs default
    if: endsWith(github.ref_name, '.0')
    needs:
      - publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
        run: |
          branch="${GITHUB_REF_NAME%.0}"
          api=https://app.readthedocs.org/api/v3/projects/scrapy
          rtd() { curl --fail-with-body -sS -H "Authorization: Token $RTD_TOKEN" "$@"; }
          rtd -X POST "$api/sync-versions/"
          for _ in $(seq 30); do
            rtd -o /dev/null "$api/versions/$branch/" 2> /dev/null && break
            sleep 10
          done
          rtd -X PATCH -H "Content-Type: application/json" -d '{"active": true}' "$api/versions/$branch/"
          rtd -X PATCH -H "Content-Type: application/json" -d "{\"default_branch\": \"$branch\"}" "$api/"
          rtd -X POST "$api/versions/latest/builds/"

  upgrade-ci-pins:
    if: endsWith(github.ref_name, '.0')
    needs:
      - publish
    uses: ./.github/workflows/upgrade-ci-pins.yml
    secrets:
      CI_PINS_APP_PRIVATE_KEY: ${{ secrets.CI_PINS_APP_PRIVATE_KEY }}
