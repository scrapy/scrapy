---
name: codspeed

on:
    push:
        branches:
            - master
    pull_request:
        types: [opened, synchronize, reopened, closed]
        paths:
            - scrapy/**
            - tests/benchmarks/**
            - .github/workflows/codspeed.yml
            - tox.ini
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    benchmark:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            # Make uv use the interpreter that actions/setup-python installed
            # instead of downloading one of its own.
            UV_PYTHON_PREFERENCE: only-system
        permissions:
            contents: read
            id-token: write  # OIDC authentication with CodSpeed

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up Python 3.14
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.14'

            - name: Set up uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  cache-dependency-glob: |
                      pyproject.toml
                      tox.ini

            - name: Install dependencies
              # tox must stay on PATH for the CodSpeed action to invoke it.
              run: |
                  uv tool install --with tox-uv tox
                  tox -n -e benchmark
            - name: Run benchmarks
              uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
              with:
                  mode: simulation
                  run: tox -e benchmark
