---
name: codspeed

on:
    push:
        branches:
            - master
    pull_request:
        types: [opened, synchronize, reopened, closed]
        paths:
            - scrapy/**
            - tests/benchmarks/**
            - .github/workflows/codspeed.yml
            - tox.ini
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    benchmark:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            # Make uv use the interpreter that actions/setup-python installed
            # instead of downloading one of its own.
            UV_PYTHON_PREFERENCE: only-system
        permissions:
            contents: read
            id-token: write  # OIDC authentication with CodSpeed

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Set up Python 3.15
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: '3.15'

            - name: Set up uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  cache-dependency-glob: |
                      pyproject.toml
                      tox.ini

            - name: Install dependencies
              # tox must stay on PATH for the CodSpeed action to invoke it.
              run: |
                  uv tool install --with tox-uv tox
                  tox -n -e benchmark
            - name: Run benchmarks
              uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
              with:
                  mode: simulation
                  run: tox -e benchmark
