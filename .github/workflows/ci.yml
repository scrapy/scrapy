name: CI

permissions:
  contents: read

on:
  push:
    branches:
    - master
    - '[0-9]+.[0-9]+'
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{github.workflow}}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Make uv use the interpreter that actions/setup-python installed instead
  # of downloading one of its own.
  UV_PYTHON_PREFERENCE: only-system

jobs:
  # pre-commit and the static checks gate the test jobs, so that a pull request
  # that fails them costs a couple of minutes of CI instead of dozens of test
  # jobs.
  pre-commit:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
    - name: Explain the failure
      if: failure()
      run: |
        message="pre-commit failed. Run 'pre-commit run --all-files' locally, commit the changes it makes and fix what it cannot fix by itself. See https://docs.scrapy.org/en/latest/contributing.html#pre-commit"
        echo "::error::$message"
        echo "$message" >> "$GITHUB_STEP_SUMMARY"

  checks:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.14"
          env:
            TOXENV: pylint
        - python-version: "3.11"
          env:
            TOXENV: mypy
        - python-version: "3.11"
          env:
            TOXENV: mypy-tests
        # Keep in sync with .readthedocs.yml.
        - python-version: "3.14"
          env:
            TOXENV: docs
        - python-version: "3.14"
          env:
            TOXENV: docs-tests
        - python-version: "3.15"
          env:
            TOXENV: twinecheck

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        cache-dependency-glob: |
          docs/requirements.txt
          pyproject.toml
          tox.ini

    - name: Run check
      env: ${{ matrix.env }}
      run: uvx --with tox-uv tox

    - name: Explain the failure
      if: failure()
      env: ${{ matrix.env }}
      run: |
        message="$TOXENV failed. Run 'uvx tox -e $TOXENV' locally to reproduce."
        echo "::error::$message"
        echo "$message" >> "$GITHUB_STEP_SUMMARY"

  ubuntu:
    needs: [pre-commit, checks]
    name: tests (ubuntu, ${{ matrix.python-version }}, ${{ matrix.env.TOXENV }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A hanging test would otherwise keep the job running until GitHub kills
      # it, without telling which test hung.
      PYTEST_ADDOPTS: --timeout=120 ${{ matrix.coverage && '-n logical' || '-n logical --no-cov' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.11"
          env:
            TOXENV: py
        - python-version: "3.15"
          env:
            TOXENV: py
          coverage: true
        - python-version: "3.15"
          env:
            TOXENV: default-reactor
          coverage: true
        - python-version: "3.15"
          env:
            TOXENV: no-reactor
          coverage: true

        # min deps
        - python-version: "3.11.17"
          env:
            TOXENV: min
          coverage: true
        - python-version: "3.11.17"
          env:
            TOXENV: min-default-reactor
          coverage: true
        - python-version: "3.11.17"
          env:
            TOXENV: min-extra-deps
          coverage: true
        - python-version: "3.11.17"
          env:
            TOXENV: min-botocore
          coverage: true

        - python-version: "3.15"
          env:
            TOXENV: extra-deps
          coverage: true
        - python-version: "3.15"
          env:
            TOXENV: no-reactor-extra-deps
          coverage: true
        - python-version: "3.15"
          env:
            TOXENV: botocore
          coverage: true

    steps: &test-steps
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system libraries
      if: runner.os == 'Linux' && contains(matrix.env.TOXENV, 'min')
      run: |
        sudo apt-get update
        sudo apt-get install libxml2-dev libxslt-dev

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        cache-dependency-glob: |
          pyproject.toml
          tox.ini

    - name: Install mitmproxy
      env:
        # mitmproxy needs a newer Python than the oldest matrix entries, so let
        # uv download one where no system interpreter is new enough.
        UV_PYTHON_PREFERENCE: system
      run: uv tool install mitmproxy

    - name: Run tests
      env: ${{ matrix.env }}
      run: uvx --with tox-uv tox

    - name: Upload coverage report
      if: ${{ matrix.coverage && !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        flags: ${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.env.TOXENV }}

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        report_type: test_results
        flags: ${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.env.TOXENV }}

  windows:
    needs: [pre-commit, checks]
    name: tests (windows, ${{ matrix.python-version }}, ${{ matrix.env.TOXENV }})
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTEST_ADDOPTS: ${{ matrix.coverage && '-n logical' || '-n logical --no-cov' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.11"
          env:
            TOXENV: py
        - python-version: "3.15"
          env:
            TOXENV: py
          coverage: true
        - python-version: "3.15"
          env:
            TOXENV: default-reactor
        - python-version: "3.15"
          env:
            TOXENV: no-reactor

        # min deps
        - python-version: "3.11.9"
          env:
            TOXENV: min
        - python-version: "3.11.9"
          env:
            TOXENV: min-extra-deps

        - python-version: "3.15"
          env:
            TOXENV: extra-deps

    steps: *test-steps

  macos:
    needs: [pre-commit, checks]
    name: tests (macos, ${{ matrix.python-version }}, ${{ matrix.env.TOXENV }})
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTEST_ADDOPTS: ${{ matrix.coverage && '-n logical' || '-n logical --no-cov' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.11"
          env:
            TOXENV: py
        - python-version: "3.15"
          env:
            TOXENV: py
          coverage: true
        - python-version: "3.15"
          env:
            TOXENV: no-reactor

    steps: *test-steps
